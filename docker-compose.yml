version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: diabetes_api
    ports:
      - "8000:8000"
  web:
    build:
      context: web
      dockerfile: Dockerfile
    container_name: diabetes_web
    ports:
      - "8501:8501"
    depends_on:
      - api
